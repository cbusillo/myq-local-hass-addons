---
version: 2

# uv is intentionally not listed: myq_local/requirements.txt is exported from
# uv.lock, and a lockfile-only update would leave the add-on image's
# requirements stale. Update Python dependencies with uv lock plus uv export.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      all-version-updates:
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/myq_local"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 30
    schedule:
      interval: weekly
