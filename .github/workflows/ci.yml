---
name: CI

"on":
  push:
    branches:
      - main
      - "launchplane/train/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: myq-local-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    name: validation-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run root tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run imported 050DCTWF tests
        run: >-
          uv run python -m unittest discover
          -s community/050dctwf/tests -p test_bridge.py -v

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Build Python package
        run: uv build

      - name: Build root app image
        run: docker build -t myq-local:0.1.0-test myq_local

      - name: Run isolated container smoke test
        run: uv run python tests/container_smoke.py
