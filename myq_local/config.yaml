name: myQ Local
version: "0.1.1"
slug: myq_local
description: Experimental local control of stock MYQ-G0401-ES hubs
url: https://github.com/cbusillo/myq-local-hass-addons/blob/main/README.md
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
init: true
services:
  - mqtt:need
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:garage
ports:
  8883/tcp: 18883
ports_description:
  8883/tcp: Hub-only TLS-PSK endpoint; redirect only the enrolled hub here
options:
  name: Garage door
  hub_ip: ""
  translated_peer_ip: ""
  control_enabled: false
  mqtt_username: ""
  mqtt_password: ""
schema:
  name: str
  hub_ip: str
  translated_peer_ip: str?
  control_enabled: bool
  mqtt_username: str?
  mqtt_password: password?
