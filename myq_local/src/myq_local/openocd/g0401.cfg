# Explicit noinit keeps adapter and target I/O behind the Python preflight.
noinit
gdb_port disabled
tcl_port disabled
telnet_port disabled
adapter driver st-link
st-link vid_pid 0x0483 0x3748
transport select dapdirect_swd
adapter speed 100
reset_config none
swd newdap myq dp -irlen 4
dap create myq.dap -chain-position myq.dp
