[project]
name = "myq-local-ha"
version = "0.1.0"
description = "Experimental local control of stock MYQ-G0401-ES hubs through Home Assistant MQTT"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["paho-mqtt==2.1.0"]

[project.scripts]
myq-local = "myq_local.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myq_local/src/myq_local"]

[dependency-groups]
dev = ["ruff>=0.14,<1", "pyyaml>=6,<7"]
