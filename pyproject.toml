[project]
name = "myq-local-ha"
version = "0.1.1"
description = "Experimental local control of stock MYQ-G0401-ES hubs through Home Assistant MQTT"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["paho-mqtt==2.1.0"]

[project.scripts]
myq-local = "myq_local.app:main"
myq-enroll = "myq_local.enroll:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myq_local/src/myq_local"]

[tool.hatch.build.targets.wheel.force-include]
"community/050dctwf/analysis/fwtool.py" = "myq_local/_community/fwtool.py"
"community/050dctwf/analysis/psmtool.py" = "myq_local/_community/psmtool.py"

[dependency-groups]
dev = ["ruff>=0.14,<1", "pyyaml>=6,<7"]

[tool.ruff]
# The community package is a pinned upstream snapshot with its own build and
# validation instructions. Keep root formatting from rewriting its provenance.
extend-exclude = ["community/050dctwf"]
